name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-geode-mod:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        shell: bash
        run: |
          sed -i -E 's/"version": *"[^"]*"/"version": "v1.2.${{ github.run_number }}"/' mod.json
          grep '"version"' mod.json

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: v5.11.2

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build-geode-mod"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Rename the mod file
        shell: bash
        run: |
          cd "${{ steps.build.outputs.build-output }}"
          for f in *.geode; do
            mv "$f" "RenderLite-v1.2.${{ github.run_number }}.geode"
          done
          ls

      - uses: actions/upload-artifact@v4
        with:
          name: RenderLite-v1.2.${{ github.run_number }}
          path: ${{ steps.build.outputs.build-output }}
